openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: WhatsApp Community Growth Manager API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: whatsapp
    description: WhatsApp connection management
  - name: contacts
    description: Contact management
  - name: groups
    description: WhatsApp group management
  - name: campaigns
    description: Campaign management
  - name: messages
    description: Message sending and logs
  - name: logs
    description: Activity logs
  - name: dashboard
    description: Dashboard statistics
  - name: ai
    description: AI message composition

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # WhatsApp
  /whatsapp/status:
    get:
      operationId: getWhatsAppStatus
      tags: [whatsapp]
      summary: Get WhatsApp connection status
      responses:
        "200":
          description: Connection status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WhatsAppStatus"

  /whatsapp/qr:
    get:
      operationId: getWhatsAppQR
      tags: [whatsapp]
      summary: Get QR code for WhatsApp login
      responses:
        "200":
          description: QR code data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WhatsAppQR"

  /whatsapp/logout:
    post:
      operationId: logoutWhatsApp
      tags: [whatsapp]
      summary: Logout from WhatsApp
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /whatsapp/groups/sync:
    post:
      operationId: syncWhatsAppGroups
      tags: [whatsapp]
      summary: Start background sync of groups from WhatsApp
      responses:
        "202":
          description: Sync started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /whatsapp/groups/sync/status:
    get:
      operationId: getGroupSyncStatus
      tags: [whatsapp]
      summary: Get the status of the current or last group sync
      responses:
        "200":
          description: Sync status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupSyncStatus"

  # Contacts
  /contacts:
    get:
      operationId: listContacts
      tags: [contacts]
      summary: List all contacts
      parameters:
        - name: search
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of contacts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Contact"
    post:
      operationId: createContact
      tags: [contacts]
      summary: Create a contact
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactInput"
      responses:
        "201":
          description: Created contact
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contact"

  /contacts/bulk:
    post:
      operationId: bulkCreateContacts
      tags: [contacts]
      summary: Bulk create contacts from text or CSV
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkContactInput"
      responses:
        "200":
          description: Import result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkImportResult"

  /contacts/{id}:
    get:
      operationId: getContact
      tags: [contacts]
      summary: Get a contact
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Contact
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contact"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateContact
      tags: [contacts]
      summary: Update a contact
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactUpdate"
      responses:
        "200":
          description: Updated contact
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contact"
    delete:
      operationId: deleteContact
      tags: [contacts]
      summary: Delete a contact
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /contacts/bulk-delete:
    post:
      operationId: bulkDeleteContacts
      tags: [contacts]
      summary: Bulk delete contacts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkDeleteInput"
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  # Groups
  /groups:
    get:
      operationId: listGroups
      tags: [groups]
      summary: List all groups
      responses:
        "200":
          description: List of groups
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Group"
    post:
      operationId: createGroup
      tags: [groups]
      summary: Create a group
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GroupInput"
      responses:
        "201":
          description: Created group
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Group"

  /groups/{id}:
    put:
      operationId: updateGroup
      tags: [groups]
      summary: Update a group
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GroupInput"
      responses:
        "200":
          description: Updated group
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Group"
    delete:
      operationId: deleteGroup
      tags: [groups]
      summary: Delete a group
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /groups/{id}/add-contacts:
    post:
      operationId: addContactsToGroup
      tags: [groups]
      summary: Add contacts to a group (runs in background)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddContactsInput"
      responses:
        "202":
          description: Job started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /groups/{id}/add-contacts/status:
    get:
      operationId: getAddContactsStatus
      tags: [groups]
      summary: Get the status of the current add-contacts background job
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Job status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AddContactsJobStatus"

  /groups/{id}/participants:
    get:
      operationId: getGroupParticipants
      tags: [groups]
      summary: Fetch participants of a WhatsApp group
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of participants
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GroupParticipant"
        "400":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # Campaigns
  /campaigns:
    get:
      operationId: listCampaigns
      tags: [campaigns]
      summary: List all campaigns
      responses:
        "200":
          description: List of campaigns
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Campaign"
    post:
      operationId: createCampaign
      tags: [campaigns]
      summary: Create a campaign
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CampaignInput"
      responses:
        "201":
          description: Created campaign
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Campaign"

  /campaigns/{id}:
    get:
      operationId: getCampaign
      tags: [campaigns]
      summary: Get a campaign
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Campaign
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Campaign"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateCampaign
      tags: [campaigns]
      summary: Update a campaign
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CampaignUpdate"
      responses:
        "200":
          description: Updated campaign
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Campaign"
    delete:
      operationId: deleteCampaign
      tags: [campaigns]
      summary: Delete a campaign
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /campaigns/{id}/start:
    post:
      operationId: startCampaign
      tags: [campaigns]
      summary: Start a campaign
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Campaign started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /campaigns/{id}/pause:
    post:
      operationId: pauseCampaign
      tags: [campaigns]
      summary: Pause a campaign
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Campaign paused
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /campaigns/{id}/cancel:
    post:
      operationId: cancelCampaign
      tags: [campaigns]
      summary: Cancel a campaign
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Campaign cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /campaigns/{id}/logs:
    get:
      operationId: getCampaignLogs
      tags: [campaigns]
      summary: Get message logs for a campaign
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Campaign logs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MessageLog"

  # Message logs
  /logs/messages:
    get:
      operationId: listMessageLogs
      tags: [logs]
      summary: List message logs
      parameters:
        - name: status
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Message logs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MessageLog"

  /logs/groups:
    get:
      operationId: listGroupLogs
      tags: [logs]
      summary: List group addition logs
      parameters:
        - name: status
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Group logs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GroupLog"

  # Dashboard
  /dashboard/stats:
    get:
      operationId: getDashboardStats
      tags: [dashboard]
      summary: Get dashboard overview stats
      responses:
        "200":
          description: Dashboard stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStats"

  /dashboard/activity:
    get:
      operationId: getRecentActivity
      tags: [dashboard]
      summary: Get recent activity feed
      responses:
        "200":
          description: Recent activity
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityItem"

  # AI
  /ai/compose:
    post:
      operationId: composeMessage
      tags: [ai]
      summary: Use AI to personalize/rewrite a message
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ComposeMessageInput"
      responses:
        "200":
          description: AI-composed message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComposeMessageResult"

  /ai/templates:
    get:
      operationId: listTemplates
      tags: [ai]
      summary: List message templates
      responses:
        "200":
          description: Templates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MessageTemplate"
    post:
      operationId: createTemplate
      tags: [ai]
      summary: Create a message template
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageTemplateInput"
      responses:
        "201":
          description: Created template
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageTemplate"

  /ai/templates/{id}:
    delete:
      operationId: deleteTemplate
      tags: [ai]
      summary: Delete a message template
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
      required:
        - success

    GroupSyncStatus:
      type: object
      properties:
        status:
          type: string
          enum: [idle, syncing]
        lastSync:
          type: object
          nullable: true
          properties:
            added:
              type: integer
            updated:
              type: integer
            removed:
              type: integer
            total:
              type: integer
            completedAt:
              type: string
              format: date-time
          required:
            - added
            - updated
            - removed
            - total
            - completedAt
        error:
          type: ["string", "null"]
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    WhatsAppStatus:
      type: object
      properties:
        connected:
          type: boolean
        status:
          type: string
        phoneNumber:
          type: ["string", "null"]
        displayName:
          type: ["string", "null"]
      required:
        - connected
        - status

    WhatsAppQR:
      type: object
      properties:
        qr:
          type: ["string", "null"]
        status:
          type: string
      required:
        - status

    Contact:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        phone:
          type: string
        tags:
          type: array
          items:
            type: string
          nullable: true
        notes:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - phone
        - createdAt

    ContactInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        phone:
          type: string
          minLength: 1
        tags:
          type: array
          items:
            type: string
          nullable: true
        notes:
          type: ["string", "null"]
      required:
        - name
        - phone

    ContactUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        phone:
          type: string
          minLength: 1
        tags:
          type: array
          items:
            type: string
          nullable: true
        notes:
          type: ["string", "null"]

    BulkContactInput:
      type: object
      properties:
        text:
          type: string
      required:
        - text

    BulkImportResult:
      type: object
      properties:
        imported:
          type: integer
        skipped:
          type: integer
        errors:
          type: array
          items:
            type: string
      required:
        - imported
        - skipped
        - errors

    BulkDeleteInput:
      type: object
      properties:
        ids:
          type: array
          items:
            type: integer
      required:
        - ids

    Group:
      type: object
      properties:
        id:
          type: integer
        groupId:
          type: string
        name:
          type: string
        memberCount:
          type: ["integer", "null"]
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - groupId
        - name
        - createdAt

    GroupInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        groupId:
          type: ["string", "null"]
        description:
          type: ["string", "null"]
        memberCount:
          type: ["integer", "null"]
      required:
        - name

    AddContactsInput:
      type: object
      properties:
        contactIds:
          type: array
          items:
            type: integer
        delayMs:
          type: integer
          description: Delay in milliseconds between each add (default 3000, min 500)
      required:
        - contactIds

    AddContactsJobStatus:
      type: object
      properties:
        status:
          type: string
          enum: [idle, running, done, error]
        total:
          type: integer
        processed:
          type: integer
        succeeded:
          type: integer
        failed:
          type: integer
        error:
          type: ["string", "null"]
        startedAt:
          type: ["string", "null"]
          format: date-time
        finishedAt:
          type: ["string", "null"]
          format: date-time
      required:
        - status

    GroupParticipant:
      type: object
      properties:
        jid:
          type: string
        phone:
          type: string
        name:
          type: ["string", "null"]
        isAdmin:
          type: boolean
      required:
        - jid
        - phone
        - isAdmin

    Campaign:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        messageTemplate:
          type: string
        status:
          type: string
        startDate:
          type: ["string", "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time
        sentCount:
          type: integer
        failedCount:
          type: integer
        totalCount:
          type: integer
      required:
        - id
        - name
        - messageTemplate
        - status
        - createdAt
        - sentCount
        - failedCount
        - totalCount

    CampaignInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        messageTemplate:
          type: string
          minLength: 1
        contactIds:
          type: array
          items:
            type: integer
        delayBetweenMessages:
          type: integer
          description: Delay in milliseconds between messages (default 3000)
      required:
        - name
        - messageTemplate
        - contactIds

    CampaignUpdate:
      type: object
      properties:
        name:
          type: string
        messageTemplate:
          type: string
        status:
          type: string

    MessageLog:
      type: object
      properties:
        id:
          type: integer
        contactId:
          type: ["integer", "null"]
        campaignId:
          type: ["integer", "null"]
        contactName:
          type: ["string", "null"]
        contactPhone:
          type: ["string", "null"]
        recipientPhone:
          type: ["string", "null"]
        campaignName:
          type: ["string", "null"]
        status:
          type: string
        message:
          type: ["string", "null"]
        errorMessage:
          type: ["string", "null"]
        sentAt:
          type: ["string", "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - status
        - createdAt

    GroupLog:
      type: object
      properties:
        id:
          type: integer
        contactId:
          type: ["integer", "null"]
        groupId:
          type: ["integer", "null"]
        contactName:
          type: ["string", "null"]
        contactPhone:
          type: ["string", "null"]
        groupName:
          type: ["string", "null"]
        action:
          type: ["string", "null"]
        details:
          type: ["string", "null"]
        status:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - status
        - createdAt

    DashboardStats:
      type: object
      properties:
        totalContacts:
          type: integer
        totalGroups:
          type: integer
        messagesSentToday:
          type: integer
        activeCampaigns:
          type: integer
        successRate:
          type: number
        totalMessagesSent:
          type: integer
        totalMessagesFailed:
          type: integer
      required:
        - totalContacts
        - totalGroups
        - messagesSentToday
        - activeCampaigns
        - successRate
        - totalMessagesSent
        - totalMessagesFailed

    ActivityItem:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
        message:
          type: string
        timestamp:
          type: string
          format: date-time
        status:
          type: ["string", "null"]
      required:
        - id
        - type
        - message
        - timestamp

    ComposeMessageInput:
      type: object
      properties:
        topic:
          type: string
        tone:
          type: ["string", "null"]
        purpose:
          type: ["string", "null"]
      required:
        - topic

    ComposeMessageResult:
      type: object
      properties:
        message:
          type: string
      required:
        - message

    MessageTemplate:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        content:
          type: string
        tone:
          type: ["string", "null"]
        purpose:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - content
        - createdAt

    MessageTemplateInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        content:
          type: string
          minLength: 1
        tone:
          type: ["string", "null"]
        purpose:
          type: ["string", "null"]
      required:
        - name
        - content
