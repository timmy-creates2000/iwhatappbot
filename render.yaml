services:
  # ── Backend API (Node.js Web Service) ────────────────────────────────────────
  - type: web
    name: iwhatsappbot-api
    runtime: node
    region: oregon
    plan: starter           # use "free" if you want, but it sleeps — bad for WA sessions

    buildCommand: corepack enable && corepack prepare pnpm@9.15.4 --activate && pnpm install --frozen-lockfile && pnpm --filter @workspace/api-server run build
    startCommand: node --enable-source-maps artifacts/api-server/dist/index.mjs

    healthCheckPath: /api/healthz

    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: TURSO_DATABASE_URL
        sync: false               # set manually in Render dashboard
      - key: TURSO_AUTH_TOKEN
        sync: false               # set manually in Render dashboard
      - key: APP_PASSWORD
        generateValue: true       # Render auto-generates a strong random value
      - key: ALLOWED_ORIGIN
        sync: false               # set to your frontend URL after first deploy
      - key: GEMINI_API_KEY
        sync: false               # optional
      - key: LOG_LEVEL
        value: info

    # Uncomment + upgrade to "standard" plan to keep WhatsApp session alive across deploys
    # disk:
    #   name: wa-auth-data
    #   mountPath: /opt/render/project/src/artifacts/api-server/.wa-auth
    #   sizeGB: 1

  # ── Frontend (Static Site) ────────────────────────────────────────────────────
  - type: web
    name: iwhatsappbot-app
    runtime: static
    region: oregon

    buildCommand: corepack enable && corepack prepare pnpm@9.15.4 --activate && pnpm install --frozen-lockfile && pnpm --filter @workspace/app run build
    staticPublishPath: artifacts/app/dist/public

    envVars:
      - key: NODE_ENV
        value: production
      - key: BASE_PATH
        value: "/"
      # Point the frontend at the backend API service URL
      # Set this to your actual Render backend URL after first deploy
      - key: VITE_API_URL
        sync: false

    # SPA routing — serve index.html for all routes
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
