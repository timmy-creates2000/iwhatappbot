services:
  - type: web
    name: iwhatsappbot
    runtime: node
    region: virginia
    plan: starter

    # NODE_ENV must be 'development' during install so pnpm includes devDependencies
    # (vite, tailwind, etc. are devDeps needed to build the frontend).
    # The app itself runs in production mode via the NODE_ENV env var below.
    buildCommand: >
      npm install -g pnpm@10.26.1 &&
      NODE_ENV=development pnpm install --no-frozen-lockfile &&
      pnpm run build

    # Start the bundled API server (it also serves the frontend static files)
    startCommand: node --enable-source-maps artifacts/api-server/dist/index.mjs

    healthCheckPath: /api/healthz

    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "8080"
      - key: LOG_LEVEL
        value: info
      # ── Set these manually in Render dashboard → Environment ──────────────
      # - key: TURSO_DATABASE_URL
      #   value: libsql://your-db.turso.io
      # - key: TURSO_AUTH_TOKEN
      #   value: your-turso-token
      # - key: APP_PASSWORD
      #   value: your-app-password
      # - key: GEMINI_API_KEY
      #   value: your-gemini-key
