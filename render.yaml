services:
  - type: web
    name: iwhatsappbot
    runtime: node
    region: virginia
    plan: starter

    # Build both frontend and API server
    buildCommand: "npm install -g pnpm@9.15.4 && pnpm install --no-frozen-lockfile && pnpm --filter @workspace/app run build && pnpm --filter @workspace/api-server run build"

    startCommand: node --enable-source-maps artifacts/api-server/dist/index.mjs

    healthCheckPath: /api/healthz

    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: LOG_LEVEL
        value: info
      # Set these in Render dashboard manually:
      # TURSO_DATABASE_URL, TURSO_AUTH_TOKEN, APP_PASSWORD, GEMINI_API_KEY
