services:
  # ── API Server ──────────────────────────────────────────────────────────────
  - type: web
    name: commgrowth-api
    runtime: node
    region: oregon
    plan: free
    rootDir: .
    buildCommand: pnpm install && pnpm run build --filter @workspace/api-server
    startCommand: node --enable-source-maps artifacts/api-server/dist/index.mjs
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8080
      - key: TURSO_DATABASE_URL
        sync: false   # Set this manually in Render dashboard
      - key: TURSO_AUTH_TOKEN
        sync: false   # Set this manually in Render dashboard
      - key: APP_PASSWORD
        sync: false   # Set this manually in Render dashboard
      - key: GEMINI_API_KEY
        sync: false   # Optional — set if you want AI compose
      - key: ALLOWED_ORIGIN
        sync: false   # Set to your frontend URL after deploying

  # ── Frontend ────────────────────────────────────────────────────────────────
  - type: web
    name: commgrowth-app
    runtime: static
    region: oregon
    plan: free
    rootDir: artifacts/app
    buildCommand: pnpm install && pnpm run build --filter @workspace/app
    staticPublishPath: dist/public
    envVars:
      - key: BASE_PATH
        value: /
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
