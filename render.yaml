services:
  - type: web
    name: iwhatsappbot-api
    runtime: node
    region: oregon          # change to: frankfurt | singapore | ohio as needed
    plan: starter           # free tier — upgrade to "standard" for persistent disk

    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @workspace/api-server run build
    startCommand: node --enable-source-maps artifacts/api-server/dist/index.mjs

    healthCheckPath: /api/healthz

    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"            # Render injects its own PORT but this is a safe default
      - key: TURSO_DATABASE_URL
        sync: false               # set manually in Render dashboard
      - key: TURSO_AUTH_TOKEN
        sync: false               # set manually in Render dashboard
      - key: APP_PASSWORD
        generateValue: true       # Render auto-generates a strong random value
      - key: ALLOWED_ORIGIN
        sync: false               # set to your frontend URL e.g. https://yourdomain.com
      - key: GEMINI_API_KEY
        sync: false               # optional — set if you use the AI compose feature
      - key: LOG_LEVEL
        value: info

    # ── Persistent disk ────────────────────────────────────────────────────────
    # Uncomment the block below (and upgrade to "standard" plan) to keep your
    # WhatsApp session alive across deploys. Without this, the .wa-auth/ folder
    # is wiped on every deploy and you must re-scan the QR code each time.
    #
    # disk:
    #   name: wa-auth-data
    #   mountPath: /opt/render/project/src/artifacts/api-server/.wa-auth
    #   sizeGB: 1
